[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uce-render"
version = "0.1.0"
description = "Universal Content Engine - Rendering System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "UCE Development Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "jinja2>=3.1,<4.0",
    "click>=8.0,<9.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "pytest-cov>=4.0,<5.0",
    "ruff>=0.1.0",
    "mypy>=1.7",
]
cliv2 = [
    "openhands-ai>=0.38.0",
    "click>=8.0,<9.0",
    "python-dotenv>=1.0.0",
    "azure-identity>=1.15.0",
    "pyyaml>=6.0.0",
    "python-pptx>=1.0.0",
]

[project.scripts]
uce-render = "cli.uce_render:cli"
cliv2 = "cliv2.interfaces.cli.main:main"

[tool.setuptools]
packages = ["src", "src.common", "src.paged", "src.paged.render", "src.paged.render.slidev", "src.tools", "src.utils", "src.generation", "src.generation.atom", "src.generation.content", "src.generation.theme", "src.generation.todo", "cli", "cliv2", "cliv2.core", "cliv2.config", "cliv2.tools", "cliv2.skills", "cliv2.interfaces", "cliv2.interfaces.cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "contract: Contract tests for schema validation",
    "integration: Integration tests for end-to-end flows",
    "unit: Unit tests for isolated components",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.ruff.per-file-ignores]
"tests/*" = ["E501"]  # Line too long in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
